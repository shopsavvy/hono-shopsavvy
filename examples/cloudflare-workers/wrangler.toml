name = "shopsavvy-hono-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
# Non-secret environment variables go here

# Secrets — set via `wrangler secret put SHOPSAVVY_API_KEY`
# SHOPSAVVY_API_KEY = "ss_live_..."

[[kv_namespaces]]
binding = "SHOPSAVVY_KV"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID"
